<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Cookie Copier</title>
  </head>
  <body>
    <header>
      <h1>Cookie Copier</h1>
      <p id="domain" class="domain">—</p>
    </header>

    <section class="controls">
      <label class="toggle">
        <input id="include-subdomains" type="checkbox" checked />
        Include subdomains
      </label>
      <input id="filter" class="filter" type="search" placeholder="Filter by name" aria-label="Filter cookies by name" />
      <label class="sort-row">
        Sort by
        <select id="sort" class="sort">
          <option value="name">Name</option>
          <option value="domain">Domain</option>
        </select>
      </label>
      <button id="refresh" class="refresh" type="button">Refresh</button>
    </section>

    <main>
      <ul id="cookie-list" class="cookie-list" aria-live="polite"></ul>
      <p id="status" class="status">Cookie listing arrives in the next update.</p>
    </main>

    <footer>
      <button id="copy-header" type="button" disabled>Copy as Cookie header</button>
      <button id="copy-json" type="button" disabled>Copy as JSON</button>
      <button id="download-json" type="button" disabled>Download JSON</button>
      <button id="download-csv" type="button" disabled>Download CSV</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
